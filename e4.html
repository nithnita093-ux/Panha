<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Shop</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}


.top-bar{
    background:#fff;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#005eff;
    font-size:30px;
    font-weight:bold;
}

.search-box{
    flex:1;
    margin:0 20px;
    display:flex;
}

.search-box input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
}

.search-box button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
}

.cart{
    font-weight:bold;
}


.navbar{
    background:#007bff;
    display:flex;
    gap:20px;
    padding:12px 20px;
}

.navbar a{
    color:white;
    text-decoration:none;
}
.container{
    display:flex;
    padding:15px;
}

.sidebar{
    width:250px;
    background:white;
    padding:15px;
}
.sidebar h3{
    margin-bottom:15px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    padding:10px 0;
    border-bottom:1px solid #eee;
}


.main-content{
    flex:1;
    margin-left:15px;
}

.banner img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:10px;
}

.section-title{
    text-align:center;
    color:#007bff;
    margin:30px 0 20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:180px;
    object-fit:contain;
}

.price{
    color:#111;
    font-weight:bold;
    margin-top:10px;
}

.categories{
    margin-top:40px;
}

.category-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:15px;
}

.category{
    background:white;
    text-align:center;
    padding:15px;
    border-radius:10px;
}

.category img{
    width:70px;
    height:70px;
    object-fit:contain;
}
@media screen {
    
}
@media(max-width:768px){

.container{
    flex-direction:column;
}

.sidebar{
    width:100%;
    margin-bottom:15px;
}

.main-content{
    margin-left:0;
}

.search-box{
    display:none;
}
.container{
            display:inline-flexbox;
            justify-content: leflt;
            gap: 20px;
            margin-top: 10px;
            margin-left:20px;
            float:center;
}       } 
.phone{
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px gray;
            width: 200px;
        }
        .phone img{
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        button{
            background: green;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background: darkgreen;
        }
</style>
</head>
